services:
  mighty:
    build: .
    ports:
      - "8080:8080"
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: ""
      POSTGRES_CONN: "postgres://postgres:mightypassword@postgres:5432/postgres?sslmode=disable"
      COGNITO_POOL_ID: "${COGNITO_POOL_ID:-}"
      COGNITO_CLIENT_ID: "${COGNITO_CLIENT_ID:-}"
      COGNITO_REGION: "${COGNITO_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_PROFILE: "${AWS_PROFILE:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    secrets:
      - postgres_password
    volumes:
      - ~/.aws:/home/nonroot/.aws:ro
    depends_on:
      - redis
      - postgres   # Mighty will start after Redis and Postgres containers start
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  postgres:
    image: "postgres:16"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_initial_schema.up.sql:/docker-entrypoint-initdb.d/01_initial.sql
      - ./migrations/000002_cognito_cutover.up.sql:/docker-entrypoint-initdb.d/02_cognito.sql

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  redis_data:
  postgres_data:
