# Production stack. Differences from dev docker-compose.yml are deliberate:
# only Caddy publishes host ports; schema comes from golang-migrate, not
# initdb.d; images are pinned/pulled, never built on the box.
services:
  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mighty
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mighty:
    image: ${ECR_IMAGE}
    restart: unless-stopped
    env_file: .env
    # NOTE: this used to also depend on an `alloy` service (condition:
    # service_started) for the Alloy/Grafana Cloud collector this stack sends
    # telemetry to. That service definition does not exist in this file yet -
    # it belongs to a pending task. Referencing a non-existent service is a
    # compose PARSE ERROR (not a soft/missing dependency), which aborts
    # `docker compose pull` under `set -euo pipefail` in remote-deploy.sh, so
    # the entry was removed rather than merged broken. Whoever lands the
    # Alloy task MUST add both the `alloy` service definition AND restore this
    # `depends_on: alloy: condition: service_started` entry.
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database", "${POSTGRES_CONN}", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
