# Production stack. Differences from dev docker-compose.yml are deliberate:
# only Caddy publishes host ports; schema comes from golang-migrate, not
# initdb.d; images are pinned/pulled, never built on the box.
services:
  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mighty
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mighty:
    image: ${ECR_IMAGE}
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      alloy:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Single telemetry egress path. The only container holding Grafana Cloud
  # credentials; `mighty` exports to alloy:4317 and never learns the vendor
  # exists. 4317 is deliberately NOT published to the host.
  alloy:
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    env_file: .env
    # Hard ceiling on a 2GB box: worst case Alloy OOMs alone rather than
    # taking Postgres with it.
    mem_limit: 256m
    pid: host
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - alloy_data:/var/lib/alloy/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database", "${POSTGRES_CONN}", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  alloy_data:
